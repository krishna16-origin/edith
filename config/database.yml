default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: sqlite3
  timeout: 5000
  database: storage/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  timeout: 5000
  database: storage/test.sqlite3

production:
  <<: *default
  adapter: sqlite3
  timeout: 5000
  database: storage/production.sqlite3
